<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HTML 3D 交互建模工坊 | HTML3d建模</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <!-- Top Navigation -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 text-white font-bold text-sm">
          3D
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-white tracking-tight">HTML 3D 建模工坊</h1>
            <span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">HTML3d建模</span>
          </div>
          <p class="text-[11px] text-slate-400">基于 WebGL / Three.js 的交互式工程结构建模库</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        <a href="https://github.com/guodonglu/HTML3D-Modeling" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>GitHub 仓库</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <div class="mb-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">已纳管的 3D 交互建模</h2>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">
            Echo 智能中枢自动化同步源 · 点击卡片即可在全屏独立渲染环境中沉浸式交互
          </p>
        </div>
        <div class="flex items-center gap-2">
          <input
            id="search-input"
            type="text"
            placeholder="搜索模型名称、部件、标签..."
            class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-400 w-64"
          />
        </div>
      </div>
    </div>

    <!-- Models Grid -->
    <div id="models-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically Rendered by JS -->
    </div>
  </main>

  <!-- Model Viewer Modal -->
  <div id="viewer-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex flex-col">
    <div class="h-12 bg-slate-900/90 border-b border-slate-800 px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span id="modal-title" class="text-xs sm:text-sm font-semibold text-slate-200 truncate max-w-xs sm:max-w-md">3D 建模预览</span>
      </div>
      <div class="flex items-center gap-2">
        <a id="modal-external-link" href="#" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-md text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1">
          <span>新标签页打开</span>
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        </a>
        <button id="modal-close-btn" class="px-2.5 py-1 rounded-md text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40">
          关闭 ✕
        </button>
      </div>
    </div>
    <div class="flex-1 w-full h-full relative bg-slate-950">
      <iframe id="viewer-iframe" class="w-full h-full border-none" allow="accelerometer; camera; gyroscope; vr"></iframe>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950/60 py-6 text-center text-xs text-slate-500">
    <p>HTML 3D 建模工坊 · 自动同步至 Echo 私有移动端中枢 · 禧玛诺 MT200 液压碟刹总成 3D CAD</p>
  </footer>

  <script>
    let allModels = [];

    async function loadModels() {
      try {
        const res = await fetch('models.json');
        if (!res.ok) throw new Error('Failed to load models.json');
        const data = await res.json();
        allModels = data.models || [];
        renderCards(allModels);
      } catch (err) {
        console.error('Error fetching manifest, using fallback:', err);
        allModels = [
          {
            id: 'shimano-mt200',
            filename: 'shimano-mt200.html',
            title: '禧玛诺 MT200 液压碟刹总成 3D 结构建模',
            subtitle: 'BL-MT201 刹把 · SM-BH59 油管 · BR-MT200 卡钳 · SM-RT26 碟片',
            tags: ['禧玛诺', '液压碟刹', 'Three.js', 'CAD拆解', '爆炸图'],
            description: '高精度 3D 结构拆解、运动学模拟与液压故障演示。支持爆炸视图无级滑动、捏刹制动力传导、X-Ray透视剖切、脱出漏油模拟及各零部件工程百科交互拾取。',
            previewUrl: 'shimano-mt200.html'
          }
        ];
        renderCards(allModels);
      }
    }

    function renderCards(models) {
      const container = document.getElementById('models-grid');
      container.innerHTML = '';

      if (models.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500">
            未找到匹配的 3D 建模文件
          </div>
        `;
        return;
      }

      models.forEach((m) => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-5 flex flex-col justify-between transition duration-200 cursor-pointer';
        card.onclick = () => openViewer(m);

        const tagsHtml = (m.tags || [])
          .map(t => `<span class="px-2 py-0.5 rounded-md bg-sky-500/10 text-sky-300 border border-sky-500/20 text-[10px]">${t}</span>`)
          .join(' ');

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-[10px] font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded">${m.category || '3D 结构'}</span>
              <span class="text-[10px] text-emerald-400 flex items-center gap-1 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                WebGL 交互
              </span>
            </div>
            <h3 class="text-base font-bold text-white tracking-tight hover:text-sky-300 transition">${m.title}</h3>
            ${m.subtitle ? `<p class="text-xs text-sky-400/90 font-mono mt-1">${m.subtitle}</p>` : ''}
            <p class="text-xs text-slate-400 mt-2.5 leading-relaxed line-clamp-3">${m.description}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
            <div class="flex flex-wrap gap-1">
              ${tagsHtml}
            </div>
            <span class="text-xs font-semibold text-sky-400 flex items-center gap-1 ml-2 shrink-0">
              进入模型 ›
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal Viewer
    const modal = document.getElementById('viewer-modal');
    const iframe = document.getElementById('viewer-iframe');
    const modalTitle = document.getElementById('modal-title');
    const modalExternalLink = document.getElementById('modal-external-link');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function openViewer(model) {
      const url = model.previewUrl || model.filename;
      modalTitle.textContent = model.title;
      modalExternalLink.href = url;
      iframe.src = url;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    modalCloseBtn.onclick = () => {
      modal.classList.add('hidden');
      iframe.src = 'about:blank';
      document.body.style.overflow = '';
    };

    // Search filter
    document.getElementById('search-input').addEventListener('input', (e) => {
      const kw = e.target.value.trim().toLowerCase();
      if (!kw) {
        renderCards(allModels);
        return;
      }
      const filtered = allModels.filter(m =>
        m.title.toLowerCase().includes(kw) ||
        (m.subtitle && m.subtitle.toLowerCase().includes(kw)) ||
        (m.description && m.description.toLowerCase().includes(kw)) ||
        (m.tags && m.tags.some(t => t.toLowerCase().includes(kw)))
      );
      renderCards(filtered);
    });

    loadModels();
  </script>
</body>
</html>
